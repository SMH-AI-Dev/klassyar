name: Build Desktop & Signed Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build:android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KLASSYAR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KLASSYAR_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing KLASSYAR_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing KLASSYAR_ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing KLASSYAR_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing KLASSYAR_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KLASSYAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klassyar-release.keystore"
          test -s "$RUNNER_TEMP/klassyar-release.keystore"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KLASSYAR_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/klassyar-release.keystore
          KLASSYAR_ANDROID_STORE_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_STORE_PASSWORD }}
          KLASSYAR_ANDROID_KEY_ALIAS: ${{ secrets.KLASSYAR_ANDROID_KEY_ALIAS }}
          KLASSYAR_ANDROID_KEY_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build:android
      - name: Build desktop app
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

  github-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
