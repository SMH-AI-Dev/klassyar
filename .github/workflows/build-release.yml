name: Build Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build:android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KLASSYAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klassyar-release.keystore"
          fi
      - name: Build APKs
        working-directory: android
        env:
          KLASSYAR_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/klassyar-release.keystore
          KLASSYAR_ANDROID_STORE_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_STORE_PASSWORD }}
          KLASSYAR_ANDROID_KEY_ALIAS: ${{ secrets.KLASSYAR_ANDROID_KEY_ALIAS }}
          KLASSYAR_ANDROID_KEY_PASSWORD: ${{ secrets.KLASSYAR_ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon
          if [ -f "$KLASSYAR_ANDROID_KEYSTORE_FILE" ] && [ -n "$KLASSYAR_ANDROID_STORE_PASSWORD" ] && [ -n "$KLASSYAR_ANDROID_KEY_ALIAS" ] && [ -n "$KLASSYAR_ANDROID_KEY_PASSWORD" ]; then
            gradle assembleRelease --no-daemon
          else
            echo "Skipping signed Android release APK; the installable debug APK will be included. Configure signing secrets for a stable release signature."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build:android
      - name: Build desktop app
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

  github-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
