name: Validate KlassYar school question banks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/question-bank-cycles-mcq"

jobs:
  validate:
    name: Build and audit every game bank
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: node node_modules/vite/bin/vite.js build
      - name: Audit all KlassYar school game banks
        run: node src/lib/auditGameCatalog.js
      - name: Verify assignment snapshot delivery and attempt limits
        run: node src/lib/auditAssignmentFlow.js
      - name: Verify compatible activity template conversions
        run: node src/lib/auditActivityConversion.js
      - name: Verify creator-to-player runtime adapters
        run: node src/lib/auditActivityRuntime.js
